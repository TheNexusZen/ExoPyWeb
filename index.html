<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exoscript (exopython) — Documentation</title>

  <!-- Fonts: Inter for UI/prose and JetBrains Mono for code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-white text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 antialiased selection:bg-sky-500/20 selection:text-sky-400">
  <!-- Sticky Top Bar -->
  <header class="sticky top-0 z-40 h-16 w-full border-b border-zinc-200 dark:border-zinc-800/80 bg-white/85 dark:bg-[#09090b]/85 backdrop-blur-md">
    <div class="mx-auto flex h-full max-w-[90rem] items-center justify-between px-4 sm:px-6 lg:px-8 gap-3">
      <!-- Left: Mobile Drawer Button + Brand + Version -->
      <div class="flex items-center gap-3 min-w-0">
        <button
          id="mobile-menu-btn"
          type="button"
          aria-label="Open navigation menu"
          class="inline-flex lg:hidden items-center justify-center rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100 transition-colors"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <button
          type="button"
          data-nav="quickstart"
          class="flex items-center gap-2.5 text-left group focus:outline-none"
        >
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600 text-white shadow-sm shadow-sky-500/20 font-mono text-sm font-bold">
            ex
          </span>
          <span class="flex items-baseline gap-1.5 truncate">
            <span class="font-semibold tracking-tight text-zinc-900 dark:text-white text-base">Exoscript</span>
            <span class="hidden sm:inline font-mono text-xs text-zinc-500 dark:text-zinc-400">(exopython)</span>
          </span>
        </button>

        <span class="hidden sm:inline-flex items-center rounded-full border border-sky-500/30 bg-sky-500/10 px-2 py-0.5 font-mono text-[11px] font-medium text-sky-600 dark:text-sky-400">
          v1.0.2
        </span>
      </div>

      <!-- Right: Playground Shortcut + Install Pill + PyPI / GitHub + Theme Toggle -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button
          type="button"
          data-nav="playground"
          class="inline-flex items-center gap-1.5 rounded-lg border border-sky-500/35 bg-sky-500/10 px-3 py-1.5 text-xs font-medium text-sky-600 dark:text-sky-400 hover:bg-sky-500/20 transition-colors"
        >
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Playground</span>
        </button>

        <button
          id="pip-copy-pill"
          type="button"
          data-copy-text="pip install exopython"
          title="Click to copy install command"
          class="hidden md:inline-flex items-center gap-2 rounded-full border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/90 px-3.5 py-1.5 font-mono text-xs text-zinc-700 dark:text-zinc-300 hover:border-sky-500/50 hover:text-zinc-900 dark:hover:text-white transition-all"
        >
          <span class="text-sky-500 select-none">$</span>
          <span class="copy-label">pip install exopython</span>
          <svg class="h-3.5 w-3.5 text-zinc-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>

        <a
          href="https://pypi.org/project/exopython/"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800/80 dark:hover:text-zinc-100 transition-colors"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
            <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
            <line x1="12" y1="22.08" x2="12" y2="12" />
          </svg>
          <span class="hidden sm:inline">PyPI</span>
        </a>

        <a
          href="https://github.com/TheNexusZen/ExoPython"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800/80 dark:hover:text-zinc-100 transition-colors"
        >
          <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
          </svg>
          <span class="hidden sm:inline">GitHub</span>
        </a>

        <button
          id="theme-toggle"
          type="button"
          aria-label="Toggle light and dark theme"
          class="inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-800 p-2 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100 transition-colors"
        >
          <svg id="icon-sun" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="icon-moon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop -->
  <div
    id="sidebar-backdrop"
    class="fixed inset-0 z-40 bg-black/60 backdrop-blur-xs hidden lg:hidden transition-opacity"
  ></div>

  <!-- Main Workspace -->
  <div class="mx-auto flex max-w-[90rem]">
    <!-- Left Sidebar -->
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-50 w-72 shrink-0 -translate-x-full lg:translate-x-0 lg:sticky lg:top-16 lg:h-[calc(100vh-4rem)] border-r border-zinc-200 dark:border-zinc-800/80 bg-white dark:bg-[#09090b] transition-transform duration-200 ease-out flex flex-col"
    >
      <!-- Mobile Drawer Header -->
      <div class="flex lg:hidden items-center justify-between h-16 px-4 border-b border-zinc-200 dark:border-zinc-800/80">
        <span class="font-semibold text-sm text-zinc-900 dark:text-white">Exoscript Docs</span>
        <button
          id="close-sidebar-btn"
          type="button"
          aria-label="Close navigation menu"
          class="rounded-lg p-1.5 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Search Box -->
      <div class="p-4 border-b border-zinc-200/70 dark:border-zinc-800/60">
        <div class="relative">
          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="doc-search"
            type="text"
            placeholder="Search docs & API..."
            autocomplete="off"
            class="w-full rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/80 pl-9 pr-8 py-2 text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition-all"
          />
          <button
            id="clear-search-btn"
            type="button"
            aria-label="Clear search"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200"
          >
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div id="search-results" class="hidden mt-2 max-h-64 overflow-y-auto rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-lg divide-y divide-zinc-100 dark:divide-zinc-800/80"></div>
      </div>

      <!-- Navigation List -->
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-6"></nav>

      <!-- Sidebar Footer -->
      <div class="p-4 border-t border-zinc-200/70 dark:border-zinc-800/60 text-xs text-zinc-500 dark:text-zinc-400 flex items-center justify-between">
        <span>MIT License</span>
        <span class="font-mono text-[11px] text-zinc-400">exopython 1.0.2</span>
      </div>
    </aside>

    <!-- Main Focused Reading & Playground Area -->
    <main class="min-w-0 flex-1 px-4 py-8 sm:px-8 lg:px-14 lg:py-12">
      <div class="mx-auto max-w-3xl">
        <article id="doc-content" class="space-y-8"></article>
        <div id="page-nav" class="mt-14 pt-6 border-t border-zinc-200 dark:border-zinc-800/80 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>
    </main>
  </div>

  <!-- Modular Scripts (Loaded in dependency order) -->
  <script src="docs-data.js"></script>
  <script src="playground.js"></script>
  <script src="app.js"></script>
</body>
</html>
